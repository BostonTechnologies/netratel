# Explicit split/custom topology port exposure; base HTTP MCP remains private.
# Match the container target to the reviewed HTTP MCP listening port.
services:
  mcp-http:
    ports:
      - "${NETRATEL_MCP_HTTP_BIND_ADDRESS:-127.0.0.1}:${NETRATEL_MCP_HTTP_PORT:-9224}:${NETRATEL_MCP_HTTP_CONTAINER_PORT:-9224}"
