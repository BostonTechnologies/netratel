name: Public PR validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  disclosure:
    name: Public disclosure gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository with Gitleaks
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo
          zricethezav/gitleaks@sha256:e5fa09c73ff086ea57f3731a4e1fb372969fb73314cc932020472eb23a5dfc7e
          detect --source . --config .gitleaks.toml --redact --no-banner
      - run: tools/ci/check-public-disclosure.sh
      - run: tools/ci/test-public-disclosure.sh

  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet restore NetRatel.sln
      - run: tools/ci/verify-product-version.sh
      - run: python3 tools/ci/test-release-validation.py
      - run: dotnet build NetRatel.sln --configuration Release --no-restore
      - run: pwsh src/NetRatel/NetRatel.Web.PlaywrightTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test NetRatel.sln --configuration Release --no-build --filter "category!=compose&category!=hosted" --results-directory TestResults -- --report-trx --report-trx-filename "netratel-tests-{asm}_{tfm}_{arch}.trx"
      - name: Fetch latest completed public client pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/fetch-published-client-pack.py --output "$RUNNER_TEMP/published-client-pack"
      - name: Verify published client pack with the existing updater contract
        env:
          NETRATEL_RELEASE_FIXTURE_DIR: ${{ runner.temp }}/published-client-pack
        run: >-
          dotnet src/NetRatel/NetRatel.Tests/bin/Release/net10.0/NetRatel.Tests.dll
          -method NetRatel.Tests.API.ClientReleaseArchiveAdapterTests.PublishedClientPackMatchesPublicationAndNormalizesForExistingUpdaters
          -noLogo
      - name: Import the published client pack without publication
        env:
          NETRATEL_RELEASE_FIXTURE_DIR: ${{ runner.temp }}/published-client-pack
        run: >-
          dotnet src/NetRatel/NetRatel.Tests/bin/Release/net10.0/NetRatel.Tests.dll
          -method NetRatel.Tests.API.ClientReleaseImportWorkerTests.PublishedClientPackImportsEveryVerifiedRuntimeWithoutPublishing
          -noLogo
      - name: Rehearse published Linux updater version gate
        env:
          NETRATEL_RELEASE_FIXTURE_DIR: ${{ runner.temp }}/published-client-pack
        run: >-
          dotnet src/NetRatel/NetRatel.Tests/bin/Release/net10.0/NetRatel.Tests.dll
          -method NetRatel.Tests.Client.PublishedPreviousLinuxUpdaterTests.PublishedUpdaterVersionGateAcceptsCandidateAfterAtomicScriptReplacement
          -noLogo
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  review-artifacts:
    name: CLI and stdio MCP review artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: |
          version="$(python3 tools/ci/product-version.py)"
          mkdir -p artifacts/cli artifacts/mcp-stdio artifacts/release-bundle
          dotnet restore src/NetRatel/NetRatel.Cli/NetRatel.Cli.csproj --runtime linux-x64
          dotnet restore src/NetRatel/NetRatel.Mcp/NetRatel.Mcp.csproj --runtime linux-x64
          dotnet publish src/NetRatel/NetRatel.Cli/NetRatel.Cli.csproj --configuration Release --no-restore --runtime linux-x64 --self-contained false --output artifacts/cli/netratel-cli-linux-x64
          dotnet publish src/NetRatel/NetRatel.Mcp/NetRatel.Mcp.csproj --configuration Release --no-restore --runtime linux-x64 --self-contained false --output artifacts/mcp-stdio/netratel-mcp-linux-x64
          cp LICENSE NOTICE artifacts/cli/netratel-cli-linux-x64/
          cp LICENSE NOTICE artifacts/mcp-stdio/netratel-mcp-linux-x64/
          python3 tools/ci/generate-runtime-sbom.py \
            --project-assets src/NetRatel/NetRatel.Cli/obj/project.assets.json \
            --project-assets src/NetRatel/NetRatel.Mcp/obj/project.assets.json \
            --distribution artifacts/cli/netratel-cli-linux-x64 \
            --distribution artifacts/mcp-stdio/netratel-mcp-linux-x64 \
            --runtime linux-x64 \
            --name NetRatel-runtime-tools \
            --version "$version" \
            --output "artifacts/netratel-${version}.spdx.json"
          dotnet pack src/NetRatel/NetRatel.Cli/NetRatel.Cli.csproj --configuration Release --no-restore --output artifacts/cli -p:PackageNoticeDirectory="$PWD/artifacts/cli/netratel-cli-linux-x64"
          cp "artifacts/cli/NetRatel.Cli.${version}.nupkg" artifacts/
          tar -C artifacts/cli -czf "artifacts/netratel-cli-${version}-linux-x64.tar.gz" netratel-cli-linux-x64
          tar -C artifacts/mcp-stdio -czf "artifacts/netratel-mcp-stdio-${version}-linux-x64.tar.gz" netratel-mcp-linux-x64
          cp release/compose.images.yaml release/compose.external-postgres.yaml release/compose.public-https.yaml release/nginx.public-https.conf release/compose.mcp-http.yaml release/.env.images.example release/INSTALL.md LICENSE NOTICE artifacts/release-bundle/
          python3 tools/ci/product-version.py --manifest-output artifacts/release-bundle/release-manifest.json
          cp -a docs artifacts/release-bundle/
          cp README.md artifacts/release-bundle/
          tar -C artifacts/release-bundle -czf "artifacts/netratel-compose-${version}.tar.gz" .
          tools/ci/verify-release-local-first-profiles.sh --bundle "artifacts/netratel-compose-${version}.tar.gz"
      - run: |
          version="$(python3 tools/ci/product-version.py)"
          (
            cd artifacts
            sha256sum *.tar.gz "netratel-${version}.spdx.json" *.nupkg > SHA256SUMS
          )
          tools/ci/verify-release-artifacts.sh --artifacts artifacts --version "$version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-netratel-cli-mcp-linux-x64
          path: artifacts
          if-no-files-found: error
          retention-days: 14

  client-packages:
    name: Native Client package (${{ matrix.runtime }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            runner: ubuntu-latest
            extension: tar.gz
          - runtime: win-x64
            runner: windows-latest
            extension: zip
          - runtime: osx-arm64
            runner: macos-latest
            extension: tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - shell: bash
        run: |
          version="$(python3 tools/ci/product-version.py)"
          directory="artifacts/netratel-client-${{ matrix.runtime }}"
          dotnet restore src/NetRatel/NetRatel.Client/NetRatel.Client.csproj --runtime "${{ matrix.runtime }}"
          dotnet publish src/NetRatel/NetRatel.Client/NetRatel.Client.csproj --configuration Release --no-restore --runtime "${{ matrix.runtime }}" --self-contained true --output "$directory"
          cp LICENSE NOTICE "$directory/"
          python3 tools/ci/generate-runtime-sbom.py \
            --project-assets src/NetRatel/NetRatel.Client/obj/project.assets.json \
            --distribution "$directory" \
            --runtime "${{ matrix.runtime }}" \
            --name "NetRatel-Client-${{ matrix.runtime }}" \
            --version "$version" \
            --output "artifacts/netratel-client-${version}-${{ matrix.runtime }}.spdx.json"
          test -f "$directory/netratel-client-manifest.json"
          grep -Fq "\"version\":\"${version}\"" "$directory/netratel-client-manifest.json"
          if [[ "${{ matrix.extension }}" == zip ]]; then
            pwsh -NoProfile -Command "Compress-Archive -Path '${directory}' -DestinationPath 'artifacts/netratel-client-${version}-${{ matrix.runtime }}.zip' -Force"
          else
            tar -C artifacts -czf "artifacts/netratel-client-${version}-${{ matrix.runtime }}.tar.gz" "netratel-client-${{ matrix.runtime }}"
          fi
          test -s "artifacts/netratel-client-${version}-${{ matrix.runtime }}.${{ matrix.extension }}"
          case "${{ matrix.runtime }}" in
            linux-x64)
              "$directory/NetRatel.Client" --terminal-pty-self-test-native
              ;;
            win-x64)
              pwsh -NoProfile -Command "& './${directory}/NetRatel.Client.exe' --version"
              ;;
            osx-arm64)
              "$directory/NetRatel.Client" --version
              ;;
          esac
      - name: Exercise macOS installer on native runner
        if: matrix.runtime == 'osx-arm64'
        shell: bash
        run: |
          dotnet build src/NetRatel/NetRatel.Tests/NetRatel.Tests.csproj --configuration Release
          dotnet src/NetRatel/NetRatel.Tests/bin/Release/net10.0/NetRatel.Tests.dll \
            -method NetRatel.Tests.Infrastructure.ScriptTemplateServiceTests.Build_MacOS_InstallsExactPackageWithoutServiceOnUnixHost
      - name: Exercise Windows installer on native runner
        if: matrix.runtime == 'win-x64'
        shell: bash
        run: |
          dotnet build src/NetRatel/NetRatel.Tests/NetRatel.Tests.csproj --configuration Release
          NETRATEL_NATIVE_CLIENT_DIRECTORY="$PWD/artifacts/netratel-client-win-x64" \
            dotnet src/NetRatel/NetRatel.Tests/bin/Release/net10.0/NetRatel.Tests.dll \
              -method NetRatel.Tests.Infrastructure.WindowsInstallerNativeTests.GeneratedPowerShellInstallerDownloadsVerifiesAndEnrollsNativePackage
      - shell: bash
        run: |
          version="$(python3 tools/ci/product-version.py)"
          (
            cd artifacts
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "netratel-client-${version}-${{ matrix.runtime }}.${{ matrix.extension }}" "netratel-client-${version}-${{ matrix.runtime }}.spdx.json" > SHA256SUMS
            else
              shasum -a 256 "netratel-client-${version}-${{ matrix.runtime }}.${{ matrix.extension }}" "netratel-client-${version}-${{ matrix.runtime }}.spdx.json" > SHA256SUMS
            fi
          )
          tools/ci/verify-client-release-artifact.sh \
            --artifacts artifacts \
            --version "$version" \
            --runtime "${{ matrix.runtime }}" \
            --extension "${{ matrix.extension }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-netratel-client-${{ matrix.runtime }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

  images:
    name: Final public image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/api/Dockerfile
          - name: web
            dockerfile: docker/web/Dockerfile
          - name: migrations
            dockerfile: docker/migrations/Dockerfile
          - name: mcp-http
            dockerfile: docker/mcp-http/Dockerfile
          - name: client
            dockerfile: docker/client/Dockerfile.public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          version="$(python3 tools/ci/product-version.py)"
          image="netratel-${{ matrix.name }}:pr-validation"
          tools/ci/build-public-image.sh --dockerfile "${{ matrix.dockerfile }}" --image "$image" --version "$version" --revision "$GITHUB_SHA"
          tools/ci/scan-public-image.sh --image "$image" --version "$version" --revision "$GITHUB_SHA"

  compose:
    name: Source Compose generic OIDC smoke test
    needs: review-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-netratel-cli-mcp-linux-x64
          path: review-artifacts
      - run: |
          version="$(python3 tools/ci/product-version.py)"
          tools/ci/build-public-image.sh --dockerfile docker/client/Dockerfile.public --image netratel-client:compose-smoke --version "$version" --revision "$GITHUB_SHA"
          tools/ci/scan-public-image.sh --image netratel-client:compose-smoke --version "$version" --revision "$GITHUB_SHA"
      - env:
          POSTGRES_PASSWORD: synthetic-ci-only-password
          OIDC_AUTHORITY: https://issuer.example.invalid
          OIDC_CLIENT_ID: synthetic-ci-only-client
          OIDC_API_SCOPE: netratel.api
          OIDC_API_AUDIENCE: netratel.api
          OIDC_TOKEN_ENDPOINT: https://issuer.example.invalid/oauth/token
          OIDC_ADMIN_GROUP_ID: synthetic-ci-only-group
          OIDC_CLIENT_SECRET: synthetic-ci-only-oidc-secret
          NETRATEL_AGENT_AUTH_PRIVATE_KEY: ./synthetic-ci-only-agent-auth.pem
          NETRATEL_CLIENT_SMOKE_IMAGE: netratel-client:compose-smoke
          NETRATEL_GATEWAY_PROXY_CONFIG_PATH: ${{ github.workspace }}/tests/compose/gateway-proxy.nginx.conf
        run: |
          docker compose -f compose.yaml config --quiet
          NETRATEL_CLI_SMOKE_ARCHIVE="review-artifacts/netratel-cli-$(python3 tools/ci/product-version.py)-linux-x64.tar.gz" \
            NETRATEL_MCP_STDIO_SMOKE_ARCHIVE="review-artifacts/netratel-mcp-stdio-$(python3 tools/ci/product-version.py)-linux-x64.tar.gz" \
            tools/ci/smoke-oidc-compose.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: branding-${{ github.job }}
          path: '**/TestResults/branding/*.png'
          if-no-files-found: error

  local-first-compose:
    name: Source Compose local-first browser smoke test
    needs: review-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTGRES_PASSWORD: synthetic-ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-netratel-cli-mcp-linux-x64
          path: review-artifacts
      - run: |
          version="$(python3 tools/ci/product-version.py)"
          tools/ci/build-public-image.sh --dockerfile docker/mcp-http/Dockerfile --image netratel-mcp-http:local-first-smoke --version "$version" --revision "$GITHUB_SHA"
          tools/ci/scan-public-image.sh --image netratel-mcp-http:local-first-smoke --version "$version" --revision "$GITHUB_SHA"
      - run: |
          docker compose -f compose.yaml config --quiet
          NETRATEL_CLI_SMOKE_ARCHIVE="review-artifacts/netratel-cli-$(python3 tools/ci/product-version.py)-linux-x64.tar.gz" \
            NETRATEL_MCP_STDIO_SMOKE_ARCHIVE="review-artifacts/netratel-mcp-stdio-$(python3 tools/ci/product-version.py)-linux-x64.tar.gz" \
            NETRATEL_LOCAL_HTTP_MCP_SMOKE_IMAGE=netratel-mcp-http:local-first-smoke \
            NETRATEL_LOCAL_FIRST_DROP_SETUP_RESPONSE=true \
            tools/ci/smoke-local-first-compose.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-first-${{ github.job }}
          path: TestResults/local-first
          if-no-files-found: warn
          retention-days: 14

  release-bundle-local-first-compose:
    name: Extracted release bundle local-first browser smoke test (${{ matrix.provider }})
    needs: review-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: bundled-postgresql
            bundle_compose_file: compose.images.yaml
            compose_overlays: ''
            external_connection: ''
            external_init: ''
            reset_acceptance: 'true'
          - provider: external-postgresql
            bundle_compose_file: compose.images.yaml
            compose_overlays: external-postgresql
            external_connection: Host=external-db;Port=5432;Database=netratel;Username=netratel;Password=synthetic-external-application-password
            external_init: external-postgresql
            reset_acceptance: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-netratel-cli-mcp-linux-x64
          path: review-artifacts
      - run: |
          version="$(python3 tools/ci/product-version.py)"
          for component in migrations api web; do
            image="netratel-${component}:release-local-first"
            tools/ci/build-public-image.sh --dockerfile "docker/${component}/Dockerfile" --image "$image" --version "$version" --revision "$GITHUB_SHA"
            tools/ci/scan-public-image.sh --image "$image" --version "$version" --revision "$GITHUB_SHA"
          done
          tools/ci/build-public-image.sh --dockerfile docker/mcp-http/Dockerfile --image netratel-mcp-http:release-local-first --version "$version" --revision "$GITHUB_SHA"
          tools/ci/scan-public-image.sh --image netratel-mcp-http:release-local-first --version "$version" --revision "$GITHUB_SHA"
      - env:
          NETRATEL_MIGRATIONS_IMAGE: netratel-migrations:release-local-first
          NETRATEL_API_IMAGE: netratel-api:release-local-first
          NETRATEL_WEB_IMAGE: netratel-web:release-local-first
          POSTGRES_PASSWORD: synthetic-ci-only-password
          NETRATEL_LOCAL_FIRST_BUNDLE_COMPOSE_FILE: ${{ matrix.bundle_compose_file }}
          NETRATEL_LOCAL_FIRST_COMPOSE_OVERLAYS: ${{ matrix.compose_overlays }}
          NETRATEL_EXTERNAL_DATABASE_CONNECTION_STRING: ${{ matrix.external_connection }}
          NETRATEL_LOCAL_FIRST_EXTERNAL_POSTGRES_INIT: ${{ matrix.external_init }}
          NETRATEL_LOCAL_FIRST_STATE_RESET_ACCEPTANCE: ${{ matrix.reset_acceptance }}
        run: |
          version="$(python3 tools/ci/product-version.py)"
          if [[ "${{ matrix.provider }}" == external-postgresql ]]; then
            export NETRATEL_LOCAL_FIRST_COMPOSE_OVERLAYS="$GITHUB_WORKSPACE/release/compose.external-postgres.yaml:$GITHUB_WORKSPACE/tests/compose/external-postgres-local-first.compose.yaml"
            export NETRATEL_LOCAL_FIRST_EXTERNAL_POSTGRES_INIT="$GITHUB_WORKSPACE/tests/compose/external-postgres-local-first-init.sql"
          fi
          NETRATEL_LOCAL_FIRST_COMPOSE_BUNDLE="review-artifacts/netratel-compose-${version}.tar.gz" \
            NETRATEL_CLI_SMOKE_ARCHIVE="review-artifacts/netratel-cli-${version}-linux-x64.tar.gz" \
            NETRATEL_MCP_STDIO_SMOKE_ARCHIVE="review-artifacts/netratel-mcp-stdio-${version}-linux-x64.tar.gz" \
            NETRATEL_LOCAL_HTTP_MCP_SMOKE_IMAGE=netratel-mcp-http:release-local-first \
            tools/ci/smoke-local-first-compose.sh
      - if: matrix.provider == 'bundled-postgresql'
        env:
          NETRATEL_MIGRATIONS_IMAGE: netratel-migrations:release-local-first
          NETRATEL_API_IMAGE: netratel-api:release-local-first
          NETRATEL_WEB_IMAGE: netratel-web:release-local-first
          POSTGRES_PASSWORD: synthetic-ci-only-password
          GH_TOKEN: ${{ github.token }}
          NETRATEL_LOCAL_FIRST_GITHUB_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 tools/ci/product-version.py)"
          certificate_dir="$(mktemp -d)"
          cp /etc/hosts "$certificate_dir/hosts"
          trap 'sudo cp "$certificate_dir/hosts" /etc/hosts; find "$certificate_dir" -depth -delete' EXIT
          printf '127.0.0.1 netratel.example\n' | sudo tee -a /etc/hosts >/dev/null
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$certificate_dir/tls.key" -out "$certificate_dir/tls.crt" \
            -subj '/CN=netratel.example' -addext 'subjectAltName=DNS:netratel.example' -days 1 >/dev/null 2>&1
          NETRATEL_LOCAL_FIRST_COMPOSE_BUNDLE="review-artifacts/netratel-compose-${version}.tar.gz" \
            NETRATEL_LOCAL_FIRST_COMPOSE_OVERLAYS="$GITHUB_WORKSPACE/release/compose.public-https.yaml" \
            NETRATEL_LOCAL_FIRST_WEB_URL=https://netratel.example \
            NETRATEL_LOCAL_FIRST_IGNORE_HTTPS_ERRORS=true \
            NETRATEL_AUTHENTICATION_MODE=Local \
            OIDC_AUTHORITY=https://stale.example.test \
            NETRATEL_PUBLIC_ORIGIN=https://netratel.example \
            NETRATEL_PUBLIC_HOST=netratel.example \
            NETRATEL_INSTALL_LINK_PUBLIC_ORIGIN=https://netratel.example \
            NETRATEL_LOCAL_FIRST_NATIVE_INSTALL=true \
            NETRATEL_LOCAL_FIRST_CA_CERT="$certificate_dir/tls.crt" \
            NETRATEL_HTTPS_BIND_ADDRESS=127.0.0.1 \
            NETRATEL_HTTPS_PORT=443 \
            NETRATEL_HTTPS_CERTIFICATE="$certificate_dir/tls.crt" \
            NETRATEL_HTTPS_PRIVATE_KEY="$certificate_dir/tls.key" \
            NO_PROXY=netratel.example,localhost,127.0.0.1 \
            no_proxy=netratel.example,localhost,127.0.0.1 \
            tools/ci/smoke-local-first-compose.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-first-${{ github.job }}-${{ matrix.provider }}
          path: TestResults/local-first
          if-no-files-found: warn
          retention-days: 14

  release-image-compose:
    name: Release-image Compose generic OIDC smoke test
    needs: review-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-netratel-cli-mcp-linux-x64
          path: review-artifacts
      - run: |
          version="$(python3 tools/ci/product-version.py)"
          for component in migrations api web; do
            image="netratel-${component}:release-smoke"
            tools/ci/build-public-image.sh --dockerfile "docker/${component}/Dockerfile" --image "$image" --version "$version" --revision "$GITHUB_SHA"
            tools/ci/scan-public-image.sh --image "$image" --version "$version" --revision "$GITHUB_SHA"
          done
          tools/ci/build-public-image.sh --dockerfile docker/client/Dockerfile.public --image netratel-client:release-smoke --version "$version" --revision "$GITHUB_SHA"
          tools/ci/scan-public-image.sh --image netratel-client:release-smoke --version "$version" --revision "$GITHUB_SHA"
      - env:
          NETRATEL_COMPOSE_SMOKE_MODE: release-images
          NETRATEL_MIGRATIONS_IMAGE: netratel-migrations:release-smoke
          NETRATEL_API_IMAGE: netratel-api:release-smoke
          NETRATEL_WEB_IMAGE: netratel-web:release-smoke
          POSTGRES_PASSWORD: synthetic-ci-only-password
          OIDC_AUTHORITY: https://issuer.example.invalid
          OIDC_CLIENT_ID: synthetic-ci-only-client
          OIDC_API_SCOPE: netratel.api
          OIDC_API_AUDIENCE: netratel.api
          OIDC_TOKEN_ENDPOINT: https://issuer.example.invalid/oauth/token
          OIDC_ADMIN_GROUP_ID: synthetic-ci-only-group
          OIDC_CLIENT_SECRET: synthetic-ci-only-oidc-secret
          NETRATEL_AGENT_AUTH_PRIVATE_KEY: ./synthetic-ci-only-agent-auth.pem
          NETRATEL_CLIENT_SMOKE_IMAGE: netratel-client:release-smoke
          NETRATEL_GATEWAY_PROXY_CONFIG_PATH: ${{ github.workspace }}/tests/compose/gateway-proxy.nginx.conf
        run: |
          docker compose -f release/compose.images.yaml -f tests/compose/oidc-smoke.compose.yaml config --quiet
          NETRATEL_COMPOSE_SMOKE_BUNDLE="review-artifacts/netratel-compose-$(python3 tools/ci/product-version.py).tar.gz" \
            NETRATEL_CLI_SMOKE_ARCHIVE="review-artifacts/netratel-cli-$(python3 tools/ci/product-version.py)-linux-x64.tar.gz" \
            NETRATEL_MCP_STDIO_SMOKE_ARCHIVE="review-artifacts/netratel-mcp-stdio-$(python3 tools/ci/product-version.py)-linux-x64.tar.gz" \
            tools/ci/smoke-oidc-compose.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: branding-${{ github.job }}
          path: '**/TestResults/branding/*.png'
          if-no-files-found: error

  postgresql-regressions:
    name: PostgreSQL provider and migration regressions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: |
          bash tools/ci/check-postgresql-only.sh
          dotnet test src/NetRatel/NetRatel.Tests/NetRatel.Tests.csproj --configuration Release \
            --filter 'FullyQualifiedName~PostgreSqlProviderRegressionTests'

  postgresql-release-upgrade:
    name: PostgreSQL previous-release upgrade (${{ matrix.authentication }})
    needs: review-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        authentication: [local, oidc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-netratel-cli-mcp-linux-x64
          path: review-artifacts
      - run: |
          version="$(python3 tools/ci/product-version.py)"
          for component in migrations api web; do
            image="netratel-${component}:postgresql-upgrade"
            tools/ci/build-public-image.sh --dockerfile "docker/${component}/Dockerfile" --image "$image" --version "$version" --revision "$GITHUB_SHA"
            tools/ci/scan-public-image.sh --image "$image" --version "$version" --revision "$GITHUB_SHA"
          done
      - env:
          GH_TOKEN: ${{ github.token }}
          NETRATEL_UPGRADE_CURRENT_API_IMAGE: netratel-api:postgresql-upgrade
          NETRATEL_UPGRADE_CURRENT_MIGRATIONS_IMAGE: netratel-migrations:postgresql-upgrade
          NETRATEL_UPGRADE_CURRENT_WEB_IMAGE: netratel-web:postgresql-upgrade
        run: |
          version="$(python3 tools/ci/product-version.py)"
          export NETRATEL_UPGRADE_COMPOSE_BUNDLE="review-artifacts/netratel-compose-${version}.tar.gz"
          if [[ "${{ matrix.authentication }}" == local ]]; then
            export NETRATEL_UPGRADE_CURRENT_CLI_ARCHIVE="review-artifacts/netratel-cli-${version}-linux-x64.tar.gz"
            tools/ci/smoke-postgresql-local-upgrade.sh
          else
            tools/ci/smoke-postgresql-oidc-upgrade.sh
          fi

  mcp-http-image-smoke:
    name: HTTP MCP image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          version="$(python3 tools/ci/product-version.py)"
          tools/ci/build-public-image.sh --dockerfile docker/mcp-http/Dockerfile --image netratel-mcp-http:pr-smoke --version "$version" --revision "$GITHUB_SHA"
          tools/ci/scan-public-image.sh --image netratel-mcp-http:pr-smoke --version "$version" --revision "$GITHUB_SHA"
      - env:
          NETRATEL_MCP_HTTP_SMOKE_IMAGE: netratel-mcp-http:pr-smoke
        run: tools/ci/smoke-mcp-http-image.sh

  pr-validation:
    name: PR validation
    if: always()
    needs: [disclosure, dotnet, review-artifacts, client-packages, images, compose, local-first-compose, release-bundle-local-first-compose, release-image-compose, postgresql-regressions, postgresql-release-upgrade, mcp-http-image-smoke]
    runs-on: ubuntu-latest
    steps:
      - env:
          DISCLOSURE_RESULT: ${{ needs.disclosure.result }}
          DOTNET_RESULT: ${{ needs.dotnet.result }}
          REVIEW_ARTIFACTS_RESULT: ${{ needs.review-artifacts.result }}
          CLIENT_PACKAGES_RESULT: ${{ needs.client-packages.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          LOCAL_FIRST_COMPOSE_RESULT: ${{ needs.local-first-compose.result }}
          RELEASE_BUNDLE_LOCAL_FIRST_COMPOSE_RESULT: ${{ needs.release-bundle-local-first-compose.result }}
          RELEASE_IMAGE_COMPOSE_RESULT: ${{ needs.release-image-compose.result }}
          POSTGRESQL_REGRESSIONS_RESULT: ${{ needs.postgresql-regressions.result }}
          POSTGRESQL_RELEASE_UPGRADE_RESULT: ${{ needs.postgresql-release-upgrade.result }}
          MCP_HTTP_IMAGE_SMOKE_RESULT: ${{ needs.mcp-http-image-smoke.result }}
        run: |
          [[ "$DISCLOSURE_RESULT" == success ]]
          [[ "$DOTNET_RESULT" == success ]]
          [[ "$REVIEW_ARTIFACTS_RESULT" == success ]]
          [[ "$CLIENT_PACKAGES_RESULT" == success ]]
          [[ "$IMAGES_RESULT" == success ]]
          [[ "$COMPOSE_RESULT" == success ]]
          [[ "$LOCAL_FIRST_COMPOSE_RESULT" == success ]]
          [[ "$RELEASE_BUNDLE_LOCAL_FIRST_COMPOSE_RESULT" == success ]]
          [[ "$RELEASE_IMAGE_COMPOSE_RESULT" == success ]]
          [[ "$POSTGRESQL_REGRESSIONS_RESULT" == success ]]
          [[ "$POSTGRESQL_RELEASE_UPGRADE_RESULT" == success ]]
          [[ "$MCP_HTTP_IMAGE_SMOKE_RESULT" == success ]]
