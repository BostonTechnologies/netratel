name: Public PR validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  disclosure:
    name: Public disclosure gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository with Gitleaks
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo
          zricethezav/gitleaks@sha256:e5fa09c73ff086ea57f3731a4e1fb372969fb73314cc932020472eb23a5dfc7e
          detect --source . --config .gitleaks.toml --redact --no-banner
      - run: tools/ci/check-public-disclosure.sh
      - run: tools/ci/test-public-disclosure.sh

  contracts:
    name: Source and release contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Validate release scripts and workflow contracts
        run: python3 tools/ci/test-release-validation.py

  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Validate product version authority
        run: tools/ci/verify-product-version.sh
      - name: Install PostgreSQL policy scanner
        run: |
          if ! command -v rg >/dev/null; then
            # Hosted images normally have usable indexes. Refresh only when needed
            # so unrelated repository metadata cannot consume the regression budget.
            if ! sudo apt-get install -y --no-install-recommends ripgrep; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends ripgrep
            fi
          fi
          rg --version
      - name: Validate source and documentation layout
        run: tools/ci/validate-layout.sh
      - name: Validate PostgreSQL-only configuration
        run: bash tools/ci/check-postgresql-only.sh
      - name: Restore solution
        run: dotnet restore NetRatel.sln
      - name: Build Release solution
        run: dotnet build NetRatel.sln --configuration Release --no-restore
      - name: Prepare fast regression containers
        run: bash tools/ci/prepare-fast-test-containers.sh
      - name: Run fast regressions (Core, Components)
        run: bash tools/ci/run-fast-regressions.sh TestResults/fast core-components
      - name: Retain fast regression receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-test-results
          path: TestResults/fast
          if-no-files-found: warn
          retention-days: 14

  api:
    name: API and PostgreSQL regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Restore API regression project
        run: dotnet restore src/NetRatel/NetRatel.API.IntegrationTests/NetRatel.API.IntegrationTests.csproj
      - name: Build Release API regression project
        run: dotnet build src/NetRatel/NetRatel.API.IntegrationTests/NetRatel.API.IntegrationTests.csproj --configuration Release --no-restore
      - name: Prepare fast regression containers
        run: bash tools/ci/prepare-fast-test-containers.sh
      - name: Run fast regressions (API)
        run: bash tools/ci/run-fast-regressions.sh TestResults/fast api
      - name: Retain fast regression receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-results
          path: TestResults/fast
          if-no-files-found: warn
          retention-days: 14

  pr-validation:
    name: PR validation
    if: always()
    needs: [disclosure, contracts, dotnet, api]
    runs-on: ubuntu-latest
    steps:
      - name: Require source checks, build and fast regressions
        env:
          DISCLOSURE_RESULT: ${{ needs.disclosure.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          DOTNET_RESULT: ${{ needs.dotnet.result }}
          API_RESULT: ${{ needs.api.result }}
        run: |
          [[ "$DISCLOSURE_RESULT" == success ]]
          [[ "$CONTRACTS_RESULT" == success ]]
          [[ "$DOTNET_RESULT" == success ]]
          [[ "$API_RESULT" == success ]]
