name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag
        required: true
        type: string

concurrency:
  group: release-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  verify:
    name: Verify release source and artifact receipt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      NETRATEL_RELEASE_SOURCE_ROOT: ${{ github.workspace }}/source
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      revision: ${{ steps.identity.outputs.revision }}
      run_id: ${{ steps.identity.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: tooling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          path: source
      - name: Verify tag, release, build run, and public package repositories
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          cd "$NETRATEL_RELEASE_SOURCE_ROOT"
          version="$(python3 "$GITHUB_WORKSPACE/tooling/tools/ci/product-version.py")"
          revision="$(git rev-parse HEAD)"
          tag="v${version}"
          test "$RELEASE_TAG" = "$tag"
          test "$(git rev-list -n 1 "$tag")" = "$revision"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$revision" origin/main
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq '[.draft,.tag_name] | @tsv' | grep -Fx $'false\t'"$tag"
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow release-build.yml --branch "$tag" --limit 50 \
            --json databaseId,headSha,headBranch,event,conclusion)"
          run_id="$(jq -r --arg sha "$revision" --arg tag "$tag" \
            '[.[] | select(.headSha == $sha and .headBranch == $tag and .event == "push" and .conclusion == "success")][0].databaseId // empty' \
            <<< "$runs")"
          test -n "$run_id"
          python3 "$GITHUB_WORKSPACE/tooling/tools/ci/promote-release.py" registry-check \
            --version "$version"
          printf 'tag=%s\nversion=%s\nrevision=%s\nrun_id=%s\n' \
            "$tag" "$version" "$revision" "$run_id" >> "$GITHUB_OUTPUT"
      - name: Authenticate workflow artifact inputs before image publication
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          RUN_ID: ${{ steps.identity.outputs.run_id }}
        run: |
          set -euo pipefail
          cd "$NETRATEL_RELEASE_SOURCE_ROOT"
          mkdir -p "$RUNNER_TEMP/review-inputs"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "netratel-${VERSION}-linux-x64" \
            --name "netratel-client-${VERSION}-linux-x64" \
            --name "netratel-client-${VERSION}-win-x64" \
            --name "netratel-client-${VERSION}-osx-arm64" \
            --dir "$RUNNER_TEMP/review-inputs"
          python3 "$GITHUB_WORKSPACE/tooling/tools/ci/promote-release.py" receipt \
            --inputs "$RUNNER_TEMP/review-inputs" \
            --output "$RUNNER_TEMP/release-receipt.json" \
            --run-id "$RUN_ID"
          python3 "$GITHUB_WORKSPACE/tooling/tools/ci/promote-release.py" preflight \
            --inputs "$RUNNER_TEMP/review-inputs" \
            --receipt "$RUNNER_TEMP/release-receipt.json" \
            --output "$RUNNER_TEMP/preflight-staged" \
            --state "$RUNNER_TEMP/preflight-state.json" \
            --version "$VERSION"

  image:
    name: Publish ${{ matrix.component }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: docker/api/Dockerfile
          - component: web
            dockerfile: docker/web/Dockerfile
          - component: migrations
            dockerfile: docker/migrations/Dockerfile
          - component: mcp-http
            dockerfile: docker/mcp-http/Dockerfile
          - component: client
            dockerfile: docker/client/Dockerfile.public
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      REVISION: ${{ needs.verify.outputs.revision }}
      NETRATEL_RELEASE_SOURCE_ROOT: ${{ github.workspace }}/source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: tooling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
          path: source
      - name: Build, scan, and push approved image
        shell: bash
        run: |
          set -euo pipefail
          cd "$NETRATEL_RELEASE_SOURCE_ROOT"
          test "$(git rev-parse HEAD)" = "$REVISION"
          component='${{ matrix.component }}'
          tag="ghcr.io/bostontechnologies/netratel-${component}:${VERSION}"
          python3 "$GITHUB_WORKSPACE/tooling/tools/ci/promote-release.py" registry-check \
            --version "$VERSION" --component "$component"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          bash tools/ci/build-public-image.sh \
            --dockerfile '${{ matrix.dockerfile }}' --image "$tag" \
            --version "$VERSION" --revision "$REVISION"
          bash tools/ci/scan-public-image.sh \
            --image "$tag" --version "$VERSION" --revision "$REVISION"
          docker push "$tag"
          digest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s\n' "ghcr.io/bostontechnologies/netratel-${component}@${digest}" \
            > "$RUNNER_TEMP/${component}.digest"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promoted-${{ matrix.component }}-digest
          path: ${{ runner.temp }}/${{ matrix.component }}.digest
          if-no-files-found: error
          retention-days: 14

  finish:
    name: Verify digests and publish release assets
    needs: [verify, image]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      packages: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      REVISION: ${{ needs.verify.outputs.revision }}
      RELEASE_RUN_ID: ${{ needs.verify.outputs.run_id }}
      NETRATEL_RELEASE_SOURCE_ROOT: ${{ github.workspace }}/source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: tooling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
          fetch-depth: 0
          path: source
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: source/global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: promoted-*-digest
          path: ${{ runner.temp }}/digests
      - name: Recreate receipt and journal exact image digests
        shell: bash
        run: |
          set -euo pipefail
          cd "$NETRATEL_RELEASE_SOURCE_ROOT"
          test "$(git rev-parse HEAD)" = "$REVISION"
          mkdir -p "$RUNNER_TEMP/review-inputs"
          gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "netratel-${VERSION}-linux-x64" \
            --name "netratel-client-${VERSION}-linux-x64" \
            --name "netratel-client-${VERSION}-win-x64" \
            --name "netratel-client-${VERSION}-osx-arm64" \
            --dir "$RUNNER_TEMP/review-inputs"
          python3 "$GITHUB_WORKSPACE/tooling/tools/ci/promote-release.py" receipt \
            --inputs "$RUNNER_TEMP/review-inputs" \
            --output "$RUNNER_TEMP/release-receipt.json" \
            --run-id "$RELEASE_RUN_ID"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          temporary = Path(os.environ['RUNNER_TEMP'])
          names = ('api', 'web', 'migrations', 'mcp-http', 'client')
          images = {}
          for name in names:
              files = list((temporary / 'digests').glob(f'**/{name}.digest'))
              if len(files) != 1:
                  raise SystemExit(f'Expected one digest for {name}')
              images[name] = files[0].read_text().strip()
          state = {
              'version': os.environ['VERSION'],
              'revision': os.environ['REVISION'],
              'packageNames': {name: f'netratel-{name}' for name in names},
              'inputReceipt': json.loads((temporary / 'release-receipt.json').read_text()),
              'images': images,
          }
          (temporary / 'promotion-state.json').write_text(json.dumps(state, indent=2) + '\n')
          PY
      - name: Verify published digests and run release-image smokes
        shell: bash
        run: |
          set -euo pipefail
          cd "$NETRATEL_RELEASE_SOURCE_ROOT"
          python3 "$GITHUB_WORKSPACE/tooling/tools/ci/promote-release.py" promote \
            --approve "${VERSION}@${REVISION}" \
            --inputs "$RUNNER_TEMP/review-inputs" \
            --receipt "$RUNNER_TEMP/release-receipt.json" \
            --output "$RUNNER_TEMP/promoted-release" \
            --state "$RUNNER_TEMP/promotion-state.json"
          (cd "$RUNNER_TEMP/promoted-release" && sha256sum -c SHA256SUMS)
      - name: Attach and verify public release assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$NETRATEL_RELEASE_SOURCE_ROOT"
          python3 "$GITHUB_WORKSPACE/tooling/tools/ci/promote-release.py" publish \
            --directory "$RUNNER_TEMP/promoted-release" \
            --tag "v${VERSION}"
          mkdir -p "$RUNNER_TEMP/public-downloads"
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/public-downloads"
          (cd "$RUNNER_TEMP/public-downloads" && sha256sum -c SHA256SUMS)
