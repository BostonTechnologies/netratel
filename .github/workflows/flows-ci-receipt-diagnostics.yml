name: Selected Flows browser artifact inspection

on:
  push:
    branches: [codex/flows-ci-receipt-diagnostics]
    paths: [.github/workflows/flows-ci-receipt-diagnostics.yml]

permissions:
  contents: read
  actions: read

jobs:
  original-receipts:
    name: Read retained synthetic browser evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download existing synthetic browser evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '42100936955'
          name: selected-flows-fit-preview-diagnostic-evidence
          path: receipts
      - name: List original receipts and one bounded synthetic screenshot
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import xml.etree.ElementTree as ET
          root = Path('receipts')
          print('Original product source: 89437d72f220e33e432ec920e6705f39c40fadcd')
          print('Original browser run: 42100936955; artifact inspection only. No tests or product commands executed here.')
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  print('ARTIFACT_ENTRY', path.relative_to(root).as_posix(), path.stat().st_size)
          for report in sorted(root.rglob('*.trx')):
              tree = ET.parse(report).getroot()
              print('ORIGINAL_COUNTERS', report.name, [node.attrib for node in tree.iter() if node.tag.endswith('Counters')])
              for result in tree.iter():
                  if result.tag.endswith('UnitTestResult') and result.attrib.get('outcome') != 'Passed':
                      print('ORIGINAL_NONPASS', result.attrib.get('testName'), result.attrib.get('outcome'))
                      for detail in result.iter():
                          if detail.tag.endswith('Message'):
                              print((detail.text or '')[:1500])
          for evidence in sorted(root.rglob('flows-execution-dialog-*.json')):
              data = evidence.read_bytes()
              if len(data) > 65536:
                  raise SystemExit('Unexpected oversized synthetic geometry evidence.')
              print('SYNTHETIC_GEOMETRY', evidence.name, json.dumps(json.loads(data)))
          for index, filename in enumerate(['flows-execution-sample-195.png', 'flows-execution-mapped-1280.png']):
              selected = list(root.rglob(filename))
              if len(selected) != 1:
                  raise SystemExit('Expected exactly one existing synthetic screenshot: ' + filename)
              screenshot = selected[0]
              data = screenshot.read_bytes()
              if not data.startswith(b'\x89PNG\r\n\x1a\n') or len(data) > 600 * 1024:
                  raise SystemExit('Selected screenshot is not a bounded PNG.')
              print('SYNTHETIC_SCREENSHOT_META', json.dumps({'path': screenshot.relative_to(root).as_posix(), 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}))
              print('SYNTHETIC_SCREENSHOT_BASE64_BEGIN_' + str(index))
              print(base64.b64encode(data).decode('ascii'))
              print('SYNTHETIC_SCREENSHOT_BASE64_END_' + str(index))
          PY
