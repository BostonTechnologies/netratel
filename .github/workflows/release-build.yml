name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      expected_version:
        description: Version declared in Directory.Build.props
        required: true

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository with Gitleaks
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo
          zricethezav/gitleaks@sha256:e5fa09c73ff086ea57f3731a4e1fb372969fb73314cc932020472eb23a5dfc7e
          detect --source . --config .gitleaks.toml --redact --no-banner
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - id: version
        run: |
          version="$(python3 tools/ci/product-version.py)"
          [[ "$version" != null && -n "$version" ]]
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            [[ "${GITHUB_REF_NAME#v}" == "$version" ]]
          else
            [[ "${{ inputs.expected_version }}" == "$version" ]]
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Require public main ancestry
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: tools/ci/check-public-disclosure.sh
      - run: tools/ci/test-public-disclosure.sh
      - run: tools/ci/verify-product-version.sh
      - run: python3 tools/ci/test-release-validation.py
      - run: bash tools/dev/test-oidc-evaluation.sh
      - run: dotnet restore NetRatel.sln
      - run: dotnet build NetRatel.sln --configuration Release --no-restore
      - run: pwsh src/NetRatel/NetRatel.Web.PlaywrightTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test NetRatel.sln --configuration Release --no-build --filter "category!=compose&category!=hosted"

  package:
    name: Build distributable artifacts
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p artifacts/cli artifacts/mcp-stdio artifacts/release-bundle
          dotnet restore src/NetRatel/NetRatel.Cli/NetRatel.Cli.csproj --runtime linux-x64
          dotnet restore src/NetRatel/NetRatel.Mcp/NetRatel.Mcp.csproj --runtime linux-x64
          dotnet publish src/NetRatel/NetRatel.Cli/NetRatel.Cli.csproj --configuration Release --no-restore --runtime linux-x64 --self-contained false --output artifacts/cli/netratel-cli-linux-x64
          dotnet publish src/NetRatel/NetRatel.Mcp/NetRatel.Mcp.csproj --configuration Release --no-restore --runtime linux-x64 --self-contained false --output artifacts/mcp-stdio/netratel-mcp-linux-x64
          cp LICENSE NOTICE artifacts/cli/netratel-cli-linux-x64/
          cp LICENSE NOTICE artifacts/mcp-stdio/netratel-mcp-linux-x64/
          python3 tools/ci/generate-runtime-sbom.py \
            --project-assets src/NetRatel/NetRatel.Cli/obj/project.assets.json \
            --project-assets src/NetRatel/NetRatel.Mcp/obj/project.assets.json \
            --distribution artifacts/cli/netratel-cli-linux-x64 \
            --distribution artifacts/mcp-stdio/netratel-mcp-linux-x64 \
            --runtime linux-x64 \
            --name NetRatel-runtime-tools \
            --version "$VERSION" \
            --output "artifacts/netratel-${VERSION}.spdx.json"
          dotnet pack src/NetRatel/NetRatel.Cli/NetRatel.Cli.csproj --configuration Release --no-restore --output artifacts/cli -p:PackageNoticeDirectory="$PWD/artifacts/cli/netratel-cli-linux-x64"
          cp "artifacts/cli/NetRatel.Cli.${VERSION}.nupkg" artifacts/
          tar -C artifacts/cli -czf "artifacts/netratel-cli-${VERSION}-linux-x64.tar.gz" netratel-cli-linux-x64
          tar -C artifacts/mcp-stdio -czf "artifacts/netratel-mcp-stdio-${VERSION}-linux-x64.tar.gz" netratel-mcp-linux-x64
          cp release/compose.images.yaml release/compose.external-postgres.yaml release/compose.public-https.yaml release/nginx.public-https.conf release/compose.mcp-http.yaml release/.env.images.example release/INSTALL.md LICENSE NOTICE artifacts/release-bundle/
          python3 tools/ci/product-version.py --manifest-output artifacts/release-bundle/release-manifest.json
          cp -a docs artifacts/release-bundle/
          cp README.md artifacts/release-bundle/
          tar -C artifacts/release-bundle -czf "artifacts/netratel-compose-${VERSION}.tar.gz" .
          tools/ci/verify-release-local-first-profiles.sh --bundle "artifacts/netratel-compose-${VERSION}.tar.gz"
      - env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          (
            cd artifacts
            sha256sum *.tar.gz *.spdx.json *.nupkg > SHA256SUMS
          )
          tools/ci/verify-release-artifacts.sh --artifacts artifacts --version "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: netratel-${{ needs.validate.outputs.version }}-linux-x64
          path: artifacts
          if-no-files-found: error
          retention-days: 14
      - uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: artifacts/**

  client-packages:
    name: Native Client (${{ matrix.runtime }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            runner: ubuntu-latest
            extension: tar.gz
          - runtime: win-x64
            runner: windows-latest
            extension: zip
          - runtime: osx-arm64
            runner: macos-latest
            extension: tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - shell: bash
        run: |
          dotnet restore src/NetRatel/NetRatel.Client/NetRatel.Client.csproj --runtime "${{ matrix.runtime }}"
          dotnet publish src/NetRatel/NetRatel.Client/NetRatel.Client.csproj --configuration Release --no-restore --runtime "${{ matrix.runtime }}" --self-contained true --output "artifacts/netratel-client-${{ matrix.runtime }}"
          cp LICENSE NOTICE "artifacts/netratel-client-${{ matrix.runtime }}/"
          python3 tools/ci/generate-runtime-sbom.py \
            --project-assets src/NetRatel/NetRatel.Client/obj/project.assets.json \
            --distribution "artifacts/netratel-client-${{ matrix.runtime }}" \
            --runtime "${{ matrix.runtime }}" \
            --name "NetRatel-Client-${{ matrix.runtime }}" \
            --version "${{ needs.validate.outputs.version }}" \
            --output "artifacts/netratel-client-${{ needs.validate.outputs.version }}-${{ matrix.runtime }}.spdx.json"
          test -f "artifacts/netratel-client-${{ matrix.runtime }}/netratel-client-manifest.json"
          grep -Fq "\"version\":\"${{ needs.validate.outputs.version }}\"" "artifacts/netratel-client-${{ matrix.runtime }}/netratel-client-manifest.json"
          if [[ "${{ matrix.extension }}" == zip ]]; then
            (
              cd artifacts
              if command -v zip >/dev/null 2>&1; then
                zip -qr "netratel-client-${{ needs.validate.outputs.version }}-${{ matrix.runtime }}.zip" "netratel-client-${{ matrix.runtime }}"
              else
                pwsh -NoLogo -NoProfile -NonInteractive -Command "Compress-Archive -Path 'netratel-client-${{ matrix.runtime }}' -DestinationPath 'netratel-client-${{ needs.validate.outputs.version }}-${{ matrix.runtime }}.zip' -Force"
              fi
            )
          else
            tar -C artifacts -czf "artifacts/netratel-client-${{ needs.validate.outputs.version }}-${{ matrix.runtime }}.tar.gz" "netratel-client-${{ matrix.runtime }}"
          fi
          case "${{ matrix.runtime }}" in
            linux-x64)
              "artifacts/netratel-client-${{ matrix.runtime }}/NetRatel.Client" --terminal-pty-self-test-native
              ;;
            win-x64)
              "artifacts/netratel-client-${{ matrix.runtime }}/NetRatel.Client.exe" --version
              ;;
            osx-arm64)
              "artifacts/netratel-client-${{ matrix.runtime }}/NetRatel.Client" --version
              ;;
          esac
      - shell: bash
        run: |
          (
            cd artifacts
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "netratel-client-${{ needs.validate.outputs.version }}-${{ matrix.runtime }}.${{ matrix.extension }}" "netratel-client-${{ needs.validate.outputs.version }}-${{ matrix.runtime }}.spdx.json" > SHA256SUMS
            else
              shasum -a 256 "netratel-client-${{ needs.validate.outputs.version }}-${{ matrix.runtime }}.${{ matrix.extension }}" "netratel-client-${{ needs.validate.outputs.version }}-${{ matrix.runtime }}.spdx.json" > SHA256SUMS
            fi
          )
          tools/ci/verify-client-release-artifact.sh \
            --artifacts artifacts \
            --version "${{ needs.validate.outputs.version }}" \
            --runtime "${{ matrix.runtime }}" \
            --extension "${{ matrix.extension }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: netratel-client-${{ needs.validate.outputs.version }}-${{ matrix.runtime }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
      - uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: artifacts/netratel-client-${{ needs.validate.outputs.version }}-${{ matrix.runtime }}.*

  images:
    name: Final container images
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/api/Dockerfile
          - name: web
            dockerfile: docker/web/Dockerfile
          - name: migrations
            dockerfile: docker/migrations/Dockerfile
          - name: mcp-http
            dockerfile: docker/mcp-http/Dockerfile
          - name: client
            dockerfile: docker/client/Dockerfile.public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          image="netratel-${{ matrix.name }}:${VERSION}"
          tools/ci/build-public-image.sh --dockerfile "${{ matrix.dockerfile }}" --image "$image" --version "$VERSION" --revision "$GITHUB_SHA"
          tools/ci/scan-public-image.sh --image "$image" --version "$VERSION" --revision "$GITHUB_SHA"

  release-image-compose-smoke:
    name: Smoke actual release-equivalent images
    needs: [validate, package]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: netratel-${{ needs.validate.outputs.version }}-linux-x64
          path: release-artifacts
      - env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for component in migrations api web; do
            image="netratel-${component}:${VERSION}"
            tools/ci/build-public-image.sh --dockerfile "docker/${component}/Dockerfile" --image "$image" --version "$VERSION" --revision "$GITHUB_SHA"
            tools/ci/scan-public-image.sh --image "$image" --version "$VERSION" --revision "$GITHUB_SHA"
          done
          tools/ci/build-public-image.sh --dockerfile docker/client/Dockerfile.public --image "netratel-client:${VERSION}" --version "$VERSION" --revision "$GITHUB_SHA"
          tools/ci/scan-public-image.sh --image "netratel-client:${VERSION}" --version "$VERSION" --revision "$GITHUB_SHA"
      - env:
          NETRATEL_COMPOSE_SMOKE_MODE: release-images
          NETRATEL_COMPOSE_SMOKE_BUNDLE: release-artifacts/netratel-compose-${{ needs.validate.outputs.version }}.tar.gz
          NETRATEL_MIGRATIONS_IMAGE: netratel-migrations:${{ needs.validate.outputs.version }}
          NETRATEL_API_IMAGE: netratel-api:${{ needs.validate.outputs.version }}
          NETRATEL_WEB_IMAGE: netratel-web:${{ needs.validate.outputs.version }}
          POSTGRES_PASSWORD: synthetic-release-smoke-password
          OIDC_AUTHORITY: https://issuer.example.invalid
          OIDC_CLIENT_ID: synthetic-release-smoke-client
          OIDC_API_SCOPE: netratel.api
          OIDC_API_AUDIENCE: netratel.api
          OIDC_TOKEN_ENDPOINT: https://issuer.example.invalid/oauth/token
          OIDC_ADMIN_GROUP_ID: synthetic-release-smoke-group
          OIDC_CLIENT_SECRET: synthetic-release-smoke-oidc-secret
          NETRATEL_AGENT_AUTH_PRIVATE_KEY: ./synthetic-release-smoke-agent-auth.pem
          NETRATEL_CLIENT_SMOKE_IMAGE: netratel-client:${{ needs.validate.outputs.version }}
          NETRATEL_GATEWAY_PROXY_CONFIG_PATH: ${{ github.workspace }}/tests/compose/gateway-proxy.nginx.conf
          NETRATEL_CLI_SMOKE_ARCHIVE: release-artifacts/netratel-cli-${{ needs.validate.outputs.version }}-linux-x64.tar.gz
          NETRATEL_MCP_STDIO_SMOKE_ARCHIVE: release-artifacts/netratel-mcp-stdio-${{ needs.validate.outputs.version }}-linux-x64.tar.gz
        run: |
          docker compose -f release/compose.images.yaml -f tests/compose/oidc-smoke.compose.yaml config --quiet
          tools/ci/smoke-oidc-compose.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: branding-${{ github.job }}
          path: '**/TestResults/branding/*.png'
          if-no-files-found: error

  release-bundle-local-first-compose-smoke:
    name: Smoke extracted release bundle local-first images (${{ matrix.provider }})
    needs: [validate, package]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: bundled-postgresql
            bundle_compose_file: compose.images.yaml
            compose_overlays: ''
            external_connection: ''
            external_init: ''
          - provider: external-postgresql
            bundle_compose_file: compose.images.yaml
            compose_overlays: external-postgresql
            external_connection: Host=external-db;Port=5432;Database=netratel;Username=netratel;Password=synthetic-external-application-password
            external_init: external-postgresql
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: netratel-${{ needs.validate.outputs.version }}-linux-x64
          path: release-artifacts
      - env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for component in migrations api web; do
            image="netratel-${component}:${VERSION}-release-local-first"
            tools/ci/build-public-image.sh --dockerfile "docker/${component}/Dockerfile" --image "$image" --version "$VERSION" --revision "$GITHUB_SHA"
            tools/ci/scan-public-image.sh --image "$image" --version "$VERSION" --revision "$GITHUB_SHA"
          done
          tools/ci/build-public-image.sh --dockerfile docker/mcp-http/Dockerfile --image "netratel-mcp-http:${VERSION}-release-local-first" --version "$VERSION" --revision "$GITHUB_SHA"
          tools/ci/scan-public-image.sh --image "netratel-mcp-http:${VERSION}-release-local-first" --version "$VERSION" --revision "$GITHUB_SHA"
      - env:
          NETRATEL_LOCAL_FIRST_COMPOSE_BUNDLE: release-artifacts/netratel-compose-${{ needs.validate.outputs.version }}.tar.gz
          NETRATEL_MIGRATIONS_IMAGE: netratel-migrations:${{ needs.validate.outputs.version }}-release-local-first
          NETRATEL_API_IMAGE: netratel-api:${{ needs.validate.outputs.version }}-release-local-first
          NETRATEL_WEB_IMAGE: netratel-web:${{ needs.validate.outputs.version }}-release-local-first
          NETRATEL_CLI_SMOKE_ARCHIVE: release-artifacts/netratel-cli-${{ needs.validate.outputs.version }}-linux-x64.tar.gz
          NETRATEL_MCP_STDIO_SMOKE_ARCHIVE: release-artifacts/netratel-mcp-stdio-${{ needs.validate.outputs.version }}-linux-x64.tar.gz
          NETRATEL_LOCAL_HTTP_MCP_SMOKE_IMAGE: netratel-mcp-http:${{ needs.validate.outputs.version }}-release-local-first
          POSTGRES_PASSWORD: synthetic-ci-only-password
          NETRATEL_LOCAL_FIRST_BUNDLE_COMPOSE_FILE: ${{ matrix.bundle_compose_file }}
          NETRATEL_LOCAL_FIRST_COMPOSE_OVERLAYS: ${{ matrix.compose_overlays }}
          NETRATEL_EXTERNAL_DATABASE_CONNECTION_STRING: ${{ matrix.external_connection }}
          NETRATEL_LOCAL_FIRST_EXTERNAL_POSTGRES_INIT: ${{ matrix.external_init }}
        run: |
          if [[ "${{ matrix.provider }}" == external-postgresql ]]; then
            export NETRATEL_LOCAL_FIRST_COMPOSE_OVERLAYS="$GITHUB_WORKSPACE/release/compose.external-postgres.yaml:$GITHUB_WORKSPACE/tests/compose/external-postgres-local-first.compose.yaml"
            export NETRATEL_LOCAL_FIRST_EXTERNAL_POSTGRES_INIT="$GITHUB_WORKSPACE/tests/compose/external-postgres-local-first-init.sql"
          fi
          tools/ci/smoke-local-first-compose.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-first-${{ github.job }}-${{ matrix.provider }}
          path: TestResults/local-first
          if-no-files-found: warn
          retention-days: 14

  postgresql-release-upgrade:
    name: PostgreSQL previous-release upgrade (${{ matrix.authentication }})
    needs: [validate, package]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        authentication: [local, oidc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: netratel-${{ needs.validate.outputs.version }}-linux-x64
          path: release-artifacts
      - env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for component in migrations api web; do
            image="netratel-${component}:postgresql-upgrade"
            tools/ci/build-public-image.sh --dockerfile "docker/${component}/Dockerfile" --image "$image" --version "$VERSION" --revision "$GITHUB_SHA"
            tools/ci/scan-public-image.sh --image "$image" --version "$VERSION" --revision "$GITHUB_SHA"
          done
      - env:
          GH_TOKEN: ${{ github.token }}
          NETRATEL_UPGRADE_CURRENT_API_IMAGE: netratel-api:postgresql-upgrade
          NETRATEL_UPGRADE_CURRENT_MIGRATIONS_IMAGE: netratel-migrations:postgresql-upgrade
          NETRATEL_UPGRADE_CURRENT_WEB_IMAGE: netratel-web:postgresql-upgrade
        run: |
          version="${{ needs.validate.outputs.version }}"
          export NETRATEL_UPGRADE_COMPOSE_BUNDLE="release-artifacts/netratel-compose-${version}.tar.gz"
          if [[ "${{ matrix.authentication }}" == local ]]; then
            export NETRATEL_UPGRADE_CURRENT_CLI_ARCHIVE="release-artifacts/netratel-cli-${version}-linux-x64.tar.gz"
            tools/ci/smoke-postgresql-local-upgrade.sh
          else
            tools/ci/smoke-postgresql-oidc-upgrade.sh
          fi

  mcp-http-image-smoke:
    name: Smoke HTTP MCP release-equivalent image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          image="netratel-mcp-http:${VERSION}"
          tools/ci/build-public-image.sh --dockerfile docker/mcp-http/Dockerfile --image "$image" --version "$VERSION" --revision "$GITHUB_SHA"
          tools/ci/scan-public-image.sh --image "$image" --version "$VERSION" --revision "$GITHUB_SHA"
      - env:
          NETRATEL_MCP_HTTP_SMOKE_IMAGE: netratel-mcp-http:${{ needs.validate.outputs.version }}
        run: tools/ci/smoke-mcp-http-image.sh

  postgresql-regressions:
    name: PostgreSQL provider and migration regressions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: |
          bash tools/ci/check-postgresql-only.sh
          dotnet test src/NetRatel/NetRatel.Tests/NetRatel.Tests.csproj --configuration Release \
            --filter 'FullyQualifiedName~PostgreSqlProviderRegressionTests'

  release-rehearsal:
    name: Release rehearsal
    if: always()
    needs: [validate, package, client-packages, images, release-image-compose-smoke, release-bundle-local-first-compose-smoke, postgresql-regressions, postgresql-release-upgrade, mcp-http-image-smoke]
    runs-on: ubuntu-latest
    steps:
      - env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          CLIENT_PACKAGES_RESULT: ${{ needs.client-packages.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          RELEASE_IMAGE_COMPOSE_RESULT: ${{ needs.release-image-compose-smoke.result }}
          RELEASE_BUNDLE_LOCAL_FIRST_COMPOSE_RESULT: ${{ needs.release-bundle-local-first-compose-smoke.result }}
          POSTGRESQL_REGRESSIONS_RESULT: ${{ needs.postgresql-regressions.result }}
          POSTGRESQL_RELEASE_UPGRADE_RESULT: ${{ needs.postgresql-release-upgrade.result }}
          MCP_HTTP_IMAGE_SMOKE_RESULT: ${{ needs.mcp-http-image-smoke.result }}
        run: |
          [[ "$VALIDATE_RESULT" == success ]]
          [[ "$PACKAGE_RESULT" == success ]]
          [[ "$CLIENT_PACKAGES_RESULT" == success ]]
          [[ "$IMAGES_RESULT" == success ]]
          [[ "$RELEASE_IMAGE_COMPOSE_RESULT" == success ]]
          [[ "$RELEASE_BUNDLE_LOCAL_FIRST_COMPOSE_RESULT" == success ]]
          [[ "$POSTGRESQL_REGRESSIONS_RESULT" == success ]]
          [[ "$POSTGRESQL_RELEASE_UPGRADE_RESULT" == success ]]
          [[ "$MCP_HTTP_IMAGE_SMOKE_RESULT" == success ]]
