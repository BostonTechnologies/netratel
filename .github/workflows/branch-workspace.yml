name: Branch workspace
on:
  push:
    branches: [fix/instance-policy-admin-and-ops-ux]
    paths:
      - .github/workflows/branch-workspace.yml
permissions:
  contents: write
concurrency:
  group: branch-workspace-${{ github.ref }}
  cancel-in-progress: false
jobs:
  workspace:
    if: github.ref == 'refs/heads/fix/instance-policy-admin-and-ops-ux'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Apply reviewed correction and remove temporary workspace
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 .github/maintenance/branch-workspace-patch.py
          git diff --check
          git rm .github/maintenance/branch-workspace-patch.py .github/workflows/branch-workspace.yml
          git add -- src
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: distinguish verified instance authority during policy persistence'
          git push origin HEAD:"$BRANCH"
