# Deployment-owned files are prepared separately; this never creates/rotates keys.
services:
  api:
    environment:
      NetRatel__Mcp__Delegation__SharedKeyBase64File: /run/netratel-mcp-secrets/delegation.key
    volumes:
      - type: bind
        source: ${NETRATEL_MCP_SECRETS_DIRECTORY:?set the owner-controlled secret directory}
        target: /run/netratel-mcp-secrets
        read_only: true
        bind:
          create_host_path: false
  mcp-http:
    environment:
      NetRatel__Mcp__Delegation__SharedKeyBase64File: /run/netratel-mcp-secrets/delegation.key
    volumes:
      - type: bind
        source: ${NETRATEL_MCP_SECRETS_DIRECTORY:?set the owner-controlled secret directory}
        target: /run/netratel-mcp-secrets
        read_only: true
        bind:
          create_host_path: false
