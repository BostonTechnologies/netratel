services:
  oidc:
    environment:
      JSON_CONFIG: >-
        {"interactiveLogin":true,"httpServer":{"type":"NettyWrapper","ssl":{"keyPassword":"${NETRATEL_SMOKE_OIDC_TLS_PASSWORD:-netratel-compose-oidc-password}","keystoreFile":"/run/netratel-smoke/oidc.p12","keystoreType":"PKCS12","keystorePassword":"${NETRATEL_SMOKE_OIDC_TLS_PASSWORD:-netratel-compose-oidc-password}"}},"tokenCallbacks":[{"issuerId":"default","requestMappings":[{"requestParam":"subject","match":"netratel-test-operator","claims":{"sub":"netratel-test-operator","preferred_username":"netratel-test-operator@example.test","roles":["Operator"],"aud":["netratel-smoke-client","netratel.api"]}},{"requestParam":"subject","match":"netratel-test-tenant-admin","claims":{"sub":"netratel-test-tenant-admin","preferred_username":"netratel-test-tenant-admin@example.test","aud":["netratel-smoke-client","netratel.api"]}},{"requestParam":"subject","match":"netratel-test-unprivileged","claims":{"sub":"netratel-test-unprivileged","preferred_username":"netratel-test-unprivileged@example.test","aud":["netratel-smoke-client","netratel.api"]}},{"requestParam":"client_id","match":"netratel-cli-smoke-client","claims":{"sub":"netratel-cli-smoke-client","preferred_username":"netratel-cli-smoke@example.test","roles":["Operator"],"scope":"netratel.api","aud":["netratel.api"]}}]}]}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://localhost:8080/isalive"]
    volumes:
      - ${NETRATEL_SMOKE_OIDC_TLS_KEYSTORE_PATH:-/tmp/netratel-compose-smoke-unavailable.p12}:/run/netratel-smoke/oidc.p12:ro

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Authentication__Oidc__Authority: https://host.docker.internal:${NETRATEL_OIDC_TEST_PORT:-18444}/default
      Authentication__Oidc__ValidIssuers__0: https://host.docker.internal:${NETRATEL_OIDC_TEST_PORT:-18444}/default
      Authentication__Oidc__ValidIssuers__1: https://127.0.0.1:${NETRATEL_OIDC_TEST_PORT:-18444}/default
      SSL_CERT_FILE: /run/netratel-smoke/ca-bundle.pem
    volumes:
      - ${NETRATEL_SMOKE_CA_BUNDLE_PATH:-/tmp/netratel-compose-smoke-unavailable-ca.pem}:/run/netratel-smoke/ca-bundle.pem:ro

  web:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Authentication__Oidc__Authority: https://host.docker.internal:${NETRATEL_OIDC_TEST_PORT:-18444}/default
      Authentication__Oidc__TokenEndpoint: https://host.docker.internal:${NETRATEL_OIDC_TEST_PORT:-18444}/default/token
      Authentication__Oidc__RequireHttpsMetadata: "true"
      SSL_CERT_FILE: /run/netratel-smoke/ca-bundle.pem
    volumes:
      - ${NETRATEL_SMOKE_CA_BUNDLE_PATH:-/tmp/netratel-compose-smoke-unavailable-ca.pem}:/run/netratel-smoke/ca-bundle.pem:ro
