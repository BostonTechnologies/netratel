events {}
http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  limit_req_zone $binary_remote_addr zone=agent_auth:10m rate=10r/s;
  server {
    listen 9444 ssl;
    ssl_certificate /run/netratel-smoke/tls.crt;
    ssl_certificate_key /run/netratel-smoke/tls.key;
    proxy_http_version 1.1;
    # OIDC saves tokens in the chunked session cookie. Allow the callback's
    # Set-Cookie response headers without changing cookie security or tokens.
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location ~* ^/api/v1/agents/(enroll|token)/?$ {
      client_max_body_size 24k;
      limit_req zone=agent_auth burst=120 nodelay;
      limit_req_status 429;
      proxy_pass http://web:9111;
    }

    location / {
      proxy_pass http://web:9111;
    }
  }
}
