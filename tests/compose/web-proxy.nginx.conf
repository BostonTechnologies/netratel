events {}
http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  server {
    listen 9444 ssl;
    ssl_certificate /run/netratel-smoke/tls.crt;
    ssl_certificate_key /run/netratel-smoke/tls.key;
    location / {
      proxy_pass http://web:9111;
      proxy_http_version 1.1;
      # OIDC saves tokens in the chunked session cookie. Allow the callback's
      # Set-Cookie response headers without changing cookie security or tokens.
      proxy_buffer_size 16k;
      proxy_buffers 4 16k;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
