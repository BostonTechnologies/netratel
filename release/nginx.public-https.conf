server {
    listen 443 ssl http2;
    server_name _;
    ssl_certificate /run/netratel-ingress/tls.crt;
    ssl_certificate_key /run/netratel-ingress/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1g;

    # Install URLs are bearer capabilities. Keep their raw request line out of
    # the repository-managed ingress logs, including proxy error diagnostics.
    location ^~ /clients/install/ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://web:9111;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Native Clients use the same public origin for the authenticated gRPC
    # gateway.  Keep the gateway transport on its dedicated API h2c listener;
    # the Web application remains the HTTP API and browser edge.
    location ^~ /netratel.gateway.v1/ {
        access_log off;
        error_log /dev/null;
        grpc_pass grpc://api:9223;
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
    }

    location / {
        proxy_pass http://web:9111;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
