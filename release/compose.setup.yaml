# Standalone one-shot tooling service; do not combine with the serving base.
# Precreate an absolute output directory and give the selected UID/GID ownership.
services:
  mcp-http:
    image: ${NETRATEL_MCP_HTTP_IMAGE:?set the approved HTTP MCP tooling image digest}
    user: "${NETRATEL_SETUP_UID:-10001}:${NETRATEL_SETUP_GID:-10001}"
    command: ["setup", "--target", "http-host"]
    environment:
      NETRATEL_SETUP_HOST_OUTPUT_DIRECTORY: ${NETRATEL_SETUP_OUTPUT_DIRECTORY:?set an absolute persistent writable output directory}
    volumes:
      - type: bind
        source: ${NETRATEL_SETUP_OUTPUT_DIRECTORY:?set an absolute persistent writable output directory}
        target: /setup-output
        bind:
          create_host_path: false
