# Standalone one-shot tooling; run on the deployment host without the serving base.
# The image seeds this durable volume for the non-root tooling identity (UID 10001).
services:
  mcp-http:
    image: ${NETRATEL_MCP_HTTP_IMAGE:?set the approved HTTP MCP tooling image digest}
    command: ["setup", "--target", "http-host"]
    environment:
      NETRATEL_SETUP_DIRECTORY: /setup-output
      NETRATEL_SETUP_VOLUME: ${NETRATEL_SETUP_VOLUME:-netratel-http-host-setup}
      NETRATEL_SETUP_COMPOSE_FILES: ${NETRATEL_SETUP_COMPOSE_FILES:-compose.images.yaml,compose.mcp-http.yaml}
    volumes:
      - http-host-setup:/setup-output
volumes:
  http-host-setup:
    name: ${NETRATEL_SETUP_VOLUME:-netratel-http-host-setup}
