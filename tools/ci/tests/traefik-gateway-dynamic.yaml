http:
  routers:
    # Only the optional native test probe reaches this real-handler seam.
    # Its Kestrel endpoint uses real gateway code and a disposable auth scheme.
    netratel-native-grpc:
      rule: "Host(`127.0.0.1`) && PathPrefix(`/netratel.gateway.v1.`) && Header(`X-NetRatel-Real-Gateway`, `1`)"
      entryPoints:
        - websecure
      priority: 200
      service: netratel-native-grpc
      middlewares:
        - netratel-grpc-route
      tls: {}

    netratel-grpc:
      rule: "Host(`netratel.example.test`) && PathPrefix(`/netratel.gateway.v1.`)"
      entryPoints:
        - websecure
      priority: 100
      service: netratel-grpc
      middlewares:
        - netratel-grpc-route
      tls: {}

    netratel-rest:
      rule: "Host(`netratel.example.test`) && PathPrefix(`/`)"
      entryPoints:
        - websecure
      priority: 10
      service: netratel-rest
      middlewares:
        - netratel-rest-route
      tls: {}

  middlewares:
    netratel-grpc-route:
      headers:
        customResponseHeaders:
          X-NetRatel-Ingress-Route: grpc-h2c-9223
    netratel-rest-route:
      headers:
        customResponseHeaders:
          X-NetRatel-Ingress-Route: rest-http-9222

  services:
    netratel-native-grpc:
      loadBalancer:
        servers:
          - url: h2c://host.docker.internal:26223

    netratel-grpc:
      loadBalancer:
        servers:
          - url: h2c://gateway-fixture:9223
    netratel-rest:
      loadBalancer:
        servers:
          - url: http://gateway-fixture:9222

tls:
  stores:
    default:
      # Native clients using the loopback IP omit SNI. Serve the same disposable
      # CA-signed certificate so strict chain and IP hostname verification remain.
      defaultCertificate:
        certFile: /run/traefik/tls.crt
        keyFile: /run/traefik/tls.key
  certificates:
    - certFile: /run/traefik/tls.crt
      keyFile: /run/traefik/tls.key
